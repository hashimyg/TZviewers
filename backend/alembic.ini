# A generic, single-database configuration for ViewsIncrease Platform.

[alembic]
# Path to migration scripts env tree template
script_location = app/alembic

# Template used to generate migration filenames (e.g., 2026_07_20_1145-a1b2c3d4e5f6_init.py)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Max length of characters for slug fragment fields
truncate_slug_length = 40

# Set to 'true' to run migrations asynchronously using asyncpg engines natively
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# Post-write hooks for code formatters (Optional for production)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %H:%M:%S
