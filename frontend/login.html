<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>Terminal Access Gateway - VCFGlow Security</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAV BLOCK MATCHES CENTRAL PLATFORM INTEGRATION -->
    <nav class="premium-nav">
        <div class="nav-wrapper">
            <a href="index.html" class="brand-logo">TZ<span>viewers</span></a>
        </div>
    </nav>

    <!-- SECURE COMPACT LOGIN CONTAINER LAYOUT -->
    <main class="app-dashboard-grid" style="grid-template-columns: 1fr; max-width: 500px; margin: 60px auto;">
        <section class="grid-card form-card-secure">
            <div class="card-content-wrapper">
                <h2 class="form-panel-title">Control Center Authentication</h2>
                <p class="subtitle-text">Enter authorized root credentials to establish a secure management pipeline session. Unauthenticated profiling sessions are dropped instantly by system firewalls.</p>
                
                <form id="loginForm" novalidate>
                    <!-- ADMINISTRATIVE USERNAME INPUT -->
                    <div class="minimal-input-group">
                        <label for="adminUsername">Security Username</label>
                        <input type="text" id="adminUsername" name="adminUsername" required minlength="3" maxlength="50" placeholder="Enter username token">
                    </div>

                    <!-- ADMINISTRATIVE PASSWORD INPUT -->
                    <div class="minimal-input-group">
                        <label for="adminPassword">Master Password Key</label>
                        <input type="password" id="adminPassword" name="adminPassword" required minlength="12" maxlength="128" placeholder="••••••••••••">
                    </div>

                    <!-- AUTHENTICATION TRIGGER BUTTON -->
                    <button type="submit" id="btnLoginSubmit" class="btn-neon-execute">
                        🔓 Authenticate & Open Session
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px;">
                    <a href="index.html" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">← Return to Public Facing Dashboard</a>
                </div>
            </div>
        </section>
    </main>

    <!-- FLOATING EMERGENCY NOTIFICATION TOAST WINDOW CONTAINER -->
    <div id="toastNotification" class="toast hidden"></div>

    <!-- SCRIPT IMPORT WITH CACHE BUSTING -->
    <script src="js/login.js?v=3.0"></script>
</body>
</html>
